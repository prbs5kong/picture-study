<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer">
<title>Survey</title>
<style>:root{--fg:#222;--muted:#666;--line:#ddd;--accent:#1f5fa8;--err:#b00020;--bg:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Arial,Helvetica,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
.prog{height:10px;background:#eee;border-radius:5px;margin:8px 0 20px}
.prog>div{height:10px;background:var(--accent);border-radius:5px}
.q{padding:14px 0;border-bottom:1px solid var(--line)}
.q:last-of-type{border-bottom:0}
.q img{max-width:100%;height:auto}
.ch{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.ch.h{flex-direction:row;justify-content:center;gap:12px}
.ch label{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);border-radius:6px;
  cursor:pointer;min-height:44px}
.ch.h label{flex:1;max-width:220px;justify-content:center}
.ch input[type=text]{flex:1;min-width:120px;padding:6px}
textarea{width:100%;min-height:90px;padding:8px;font:inherit}
.err{color:var(--err);font-weight:bold;margin:4px 0}
.nav{text-align:right;margin:20px 0 40px}
button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:12px 28px;font-size:16px;cursor:pointer}
.end{padding:40px 0;font-size:17px}
.big{font-size:20px;padding:16px 34px}
.mail{font-size:18px;font-weight:bold}
.cp textarea{min-height:120px;font:12px/1.4 monospace}
.rst{text-align:center;margin:10px 0 30px;font-size:13px}
.rst a{color:var(--muted)}
button.reset{background:#666}
</style></head>
<body><main id="app"><noscript><p>This survey needs JavaScript. Please turn it on and open this page again.</p></noscript>
</main>
<script src="files/survey_data.js"></script>
<script src="files/survey.js"></script>
</body></html>
